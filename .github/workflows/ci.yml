name: RSI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s rsi/tests -v
        env:
          PYTHONPATH: rsi
      - run: python3 -m unittest discover -p 'test_*.py' -v
        env:
          PYTHONPATH: rsi
