name: Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-coforge-staging-rsi
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s rsi/tests -v
        env:
          PYTHONPATH: rsi
      - run: python3 -m unittest discover -p 'test_*.py' -v
        env:
          PYTHONPATH: rsi

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: vars
        run: |
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${repo}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}
            ${{ steps.vars.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      REMOTE: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      REMOTE_DIR: /home/deploy/coforge-rsi
    steps:
      - uses: actions/checkout@v4
      - name: Verify deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          RSI_WEB_MODEL_API_KEY: ${{ secrets.RSI_WEB_MODEL_API_KEY }}
          RSI_PI_MODELS_JSON: ${{ secrets.RSI_PI_MODELS_JSON }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_HOST_KEY RSI_WEB_MODEL_API_KEY RSI_PI_MODELS_JSON; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          printf 'Host deploy-host\n  HostName %s\n  IdentityFile ~/.ssh/id_deploy\n  BatchMode yes\n  ConnectTimeout 20\n  StrictHostKeyChecking yes\n' "$DEPLOY_HOST" > ~/.ssh/config
      - name: Upload compose file and .env
        env:
          RSI_WEB_MODEL_API_KEY: ${{ secrets.RSI_WEB_MODEL_API_KEY }}
          RSI_PI_MODELS_JSON: ${{ secrets.RSI_PI_MODELS_JSON }}
        run: |
          user="${REMOTE%@*}"
          ssh "$user@deploy-host" "mkdir -p $REMOTE_DIR/data"
          scp compose.yaml "$user@deploy-host:$REMOTE_DIR/compose.yaml"
          python3 - <<'PY' | ssh "$user@deploy-host" "umask 077 && cat > $REMOTE_DIR/.env.tmp && mv $REMOTE_DIR/.env.tmp $REMOTE_DIR/.env"
          import json, os
          api_key = os.environ['RSI_WEB_MODEL_API_KEY']
          if '\n' in api_key or '\r' in api_key:
              raise SystemExit('RSI_WEB_MODEL_API_KEY must be single-line')
          models_json = json.dumps(json.loads(os.environ['RSI_PI_MODELS_JSON']), separators=(',', ':'), ensure_ascii=False)
          print(f'RSI_WEB_MODEL_API_KEY={api_key}')
          print(f'RSI_PI_MODELS_JSON={models_json}')
          PY
      - name: Pull image and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          ssh "${REMOTE%@*}@deploy-host" "set -euo pipefail
            export XDG_RUNTIME_DIR=/run/user/\$(id -u) DOCKER_HOST=unix:///run/user/\$(id -u)/docker.sock DOCKER_CONFIG=$REMOTE_DIR/.docker
            cd $REMOTE_DIR
            docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null
            trap 'docker logout ghcr.io >/dev/null' EXIT
            export COFORGE_RSI_IMAGE='$IMAGE'
            docker compose pull
            docker compose up -d --remove-orphans" <<< "$GHCR_TOKEN"
      - name: Verify health
        run: |
          user="${REMOTE%@*}"
          ssh "$user@deploy-host" "set -euo pipefail
            for _ in \$(seq 1 30); do
              if curl -fsS http://127.0.0.1:18766/api/health; then
                exit 0
              fi
              sleep 1
            done
            exit 1"
