name: Team credential bootstrap
run-name: RSI bootstrap ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique setup request ID
        required: true
        type: string
      recipient_cert:
        description: Ephemeral public X509 certificate generated by setup.sh
        required: true
        type: string
permissions:
  contents: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt configuration for the requesting team member
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          RECIPIENT_CERT: ${{ inputs.recipient_cert }}
          RSI_WEB_MODEL_API_KEY: ${{ secrets.RSI_WEB_MODEL_API_KEY }}
          RSI_PI_MODELS_JSON: ${{ secrets.RSI_PI_MODELS_JSON }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, tempfile
          assert re.fullmatch(r'[a-f0-9]{32}', os.environ['REQUEST_ID']), 'Invalid request ID'
          names = ('RSI_WEB_MODEL_API_KEY', 'RSI_PI_MODELS_JSON')
          assert all(os.environ.get(k) for k in names), 'Repository model secrets are missing'
          with tempfile.TemporaryDirectory() as temporary:
              cert = pathlib.Path(temporary) / 'recipient.pem'
              cert.write_text(os.environ['RECIPIENT_CERT'])
              subprocess.run(['openssl', 'x509', '-in', str(cert), '-noout', '-checkend', '0'], check=True)
              subprocess.run(['openssl', 'cms', '-encrypt', '-binary', '-aes-256-gcm', '-outform', 'DER',
                              '-out', 'credentials.p7m', str(cert)],
                             input=json.dumps({k: os.environ[k] for k in names}).encode(), check=True)
          print('Configuration encrypted for this request; no plaintext artifact was written.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rsi-credentials-${{ inputs.request_id }}
          path: credentials.p7m
          retention-days: 1
          if-no-files-found: error
