[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "general-rsi"
version = "0.1.1"
description = "Environment-grounded goal loops and validated nonparametric experience evolution"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rsi = "general_rsi.cli:main"

[tool.setuptools.packages.find]
include = ["general_rsi*"]
